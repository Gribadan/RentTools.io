# rent-tool — permanent size caps for the systemd journal.
#
# Install path on the droplet:
#   /etc/systemd/journald.conf.d/rent-tool-caps.conf
# then: sudo systemctl restart systemd-journald
#
# Background: on 2026-08-06 the droplet ran out of disk (100 % of 8.7 GB).
# The single biggest offender was the systemd journal at 830 MB — Ubuntu's
# defaults let it grow to ~4 GB. When disk hits 100 %, every DB write
# fails: sync cron 500s, Google sign-in can't write a session, health
# endpoint reports error. The check-resources.sh script auto-prunes when
# disk >= 90 % as a runtime safety net, but this file is the durable
# prevention — the journal is capped at 200 MB regardless of app state.
#
# Adjust these upward if you actually need more log history than 30 days.

[Journal]
SystemMaxUse=200M
SystemKeepFree=500M
RuntimeMaxUse=50M
MaxRetentionSec=30day
