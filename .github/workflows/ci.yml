name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Module-level Prisma init in src/lib/prisma.ts requires *some* DB env.
      # No queries are executed during `next build` or `vitest run`, so a
      # local SQLite path that never has to exist is sufficient and keeps
      # CI hermetic — no secrets, no Turso, no Gemini.
      DATABASE_URL: "file:./ci-build.db"
      JWT_SECRET: "ci-only-not-a-real-secret-just-for-build-pass"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$ARCHIVE" | sha256sum --check --status
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml

      - name: Pull request policy checks
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|build|perf|revert|deps)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::PR title must use Conventional Commits, e.g. 'fix(calendar): preserve custom channel occupancy'."
            exit 1
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          has() { printf '%s\n' "$CHANGED" | grep -qx "$1"; }

          if has prisma/schema.prisma && ! has prisma/push-schema.ts; then
            echo "::error::prisma/schema.prisma changed without production DDL in prisma/push-schema.ts."
            exit 1
          fi
          if has prisma/push-schema.ts && ! has prisma/schema.prisma; then
            echo "::error::prisma/push-schema.ts changed without the Prisma model in prisma/schema.prisma."
            exit 1
          fi
          if has package.json && ! has package-lock.json; then
            echo "::error::package.json changed without package-lock.json."
            exit 1
          fi
          echo "PR policy checks: clean."

      - name: Forbidden-paths check
        # Defence-in-depth alongside .gitignore + .githooks/pre-commit.
        # Scans tracked files in this commit for patterns that should
        # never appear in the public repo (AI-tool config, local notes,
        # task backlogs, env files, keys, DB dumps).
        run: |
          set -euo pipefail
          FORBIDDEN='^\.routines/|^\.local/|^\.claude/|^\.cursor/|^\.aider|^\.playwright-mcp/|^CLAUDE\.md$|^claude\.md$|^AGENTS\.md$|^agents\.md$|^MEMORY\.md$|^TASKS\.md$|^ROUTINE\.md$|^OPS-ROUTINE\.md$|^\.env$|^\.env\.local$|^\.env\.production$|\.db$|\.sqlite[0-9]*$|\.dump$|\.sql\.gz$|^id_(rsa|ed25519|ecdsa)|\.ppk$|\.pfx$|\.p12$|^authorized_keys$|\.sentryclirc$|^\.env\.sentry-build-plugin$'
          # Allow .env.example explicitly (matches \.env\..+ otherwise).
          BAD=$(git ls-files | grep -E "$FORBIDDEN" | grep -vE '^\.env\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Found forbidden tracked files in the public repo:"
            echo "$BAD" | sed 's/^/  /'
            echo ""
            echo "These should not be committed. Either:"
            echo "  1) Untrack: git rm --cached <path>; commit"
            echo "  2) Or add an explicit allow for it in .githooks/pre-commit + this workflow"
            exit 1
          fi
          echo "Forbidden-paths scan: clean."

      - name: Secret-content scan
        # Third layer (after .gitignore + .githooks/pre-commit). The
        # path scan above catches a whole forbidden file; this catches a
        # secret pasted INTO an otherwise innocent tracked file. Same
        # high-confidence provider-key / PEM patterns the pre-commit
        # hook greps for — mirrored here so a contributor who bypassed
        # the hook (--no-verify, or never ran `npm install` to register
        # the hooksPath) still gets caught before merge.
        run: |
          set -euo pipefail
          SECRET_RE='-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|sk_live_[0-9a-zA-Z]{20,}|ghp_[0-9A-Za-z]{36}|xox[baprs]-[0-9A-Za-z-]{10,}'
          # git grep over tracked files only. `-e` is required — the regex
          # starts with `-` (the PEM header) and git would otherwise parse
          # it as a flag. Exclude package-lock.json (integrity hashes can
          # coincidentally match key-shaped regexes) and other lockfiles.
          HITS=$(git grep -nE -e "$SECRET_RE" -- ':!package-lock.json' ':!*.lock' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Found secret-shaped strings in tracked files:"
            echo "$HITS" | sed 's/^/  /'
            echo ""
            echo "If a real credential leaked: remove it AND rotate the key"
            echo "(assume it is burned). If it is a documented sample value,"
            echo "rephrase so it no longer matches a live-credential pattern."
            exit 1
          fi
          echo "Secret-content scan: clean."

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high/critical only)
        # RT-21.9: gate merges to master on the absence of known
        # high/critical CVEs. Moderate findings are surfaced via
        # Dependabot PRs (.github/dependabot.yml) without blocking CI.
        run: npm audit --audit-level=high

      - name: Type-check + production build
        run: npx next build

      - name: Unit tests
        run: npx vitest run

      - name: Validate production Docker image and SQLite migrations
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --file deploy/docker/Dockerfile \
            --build-arg GIT_COMMIT_SHA="$IMAGE_SHA" \
            --tag "renttools-ci:$IMAGE_SHA" .
          # Exercise the actual Linux runtime without production credentials or
          # network access. Reapplying DDL must preserve a valid SQLite schema.
          docker run --rm --network none \
            --env DATABASE_URL=file:/tmp/renttools-ci.db \
            --entrypoint sh "renttools-ci:$IMAGE_SHA" -ec '
              test "$(id -u)" = 1000
              ./node_modules/.bin/tsx prisma/push-schema.ts
              ./node_modules/.bin/tsx prisma/push-schema.ts
              test "$(sqlite3 /tmp/renttools-ci.db "PRAGMA integrity_check;")" = ok
              sqlite3 /tmp/renttools-ci.db ".schema Reservation" | grep -q "CREATE TABLE"
            '
