name: Deploy RentTools

# Build an immutable image on GitHub; the restricted server gateway replaces
# only the existing RentTools Compose service on the shared Docker host.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy current master, or inspect the configured server without changing it"
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - preflight

permissions:
  contents: read
  actions: read

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: renttools-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Inspect configured server (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: Production
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight' &&
          github.repository == 'Gribadan/RentTools.io' && github.ref_protected &&
          vars.DROPLET_HOST != '' }}
    steps:
      - name: Inspect through the installed read-only gateway command
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.DROPLET_KNOWN_HOSTS }}
          DROPLET_HOST: ${{ vars.DROPLET_HOST }}
          DROPLET_USER: ${{ vars.DROPLET_USER }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$DROPLET_USER" ]; then
            echo "::error::Deployment credentials or host configuration are incomplete."
            exit 1
          fi
          SSH_DIR="$RUNNER_TEMP/renttools-preflight"
          mkdir -m 700 -p "$SSH_DIR"
          trap 'rm -f "$SSH_DIR/id_deploy"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$SSH_DIR/id_deploy"
          chmod 600 "$SSH_DIR/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          if ! ssh -i "$SSH_DIR/id_deploy" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
              -o ConnectTimeout=15 -o ConnectionAttempts=1 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              "$DROPLET_USER@$DROPLET_HOST" renttools-preflight \
              2> "$SSH_DIR/ssh-error.log"; then
            if grep -qi 'timed out' "$SSH_DIR/ssh-error.log"; then
              echo "::error::Configured SSH host timed out from the GitHub runner."
            elif grep -qi 'Permission denied' "$SSH_DIR/ssh-error.log"; then
              echo "::error::Configured SSH credential was rejected."
            elif grep -qi 'Host key verification failed\|REMOTE HOST IDENTIFICATION HAS CHANGED' "$SSH_DIR/ssh-error.log"; then
              echo "::error::Configured SSH host key did not verify."
            else
              echo "::error::Read-only inspection failed; no deploy command was run."
            fi
            exit 1
          fi

  build:
    name: Build Docker image on runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      ${{ github.repository == 'Gribadan/RentTools.io' && vars.DROPLET_HOST != '' &&
          ((github.event_name == 'workflow_dispatch' && inputs.mode != 'preflight' &&
            github.ref == 'refs/heads/master') ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'master' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    env:
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_LEGACY_PASSPORT_OCR_ENABLED: ${{ vars.NEXT_PUBLIC_LEGACY_PASSPORT_OCR_ENABLED }}
    steps:
      - name: Verify current master and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MASTER=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$DEPLOY_SHA" != "$CURRENT_MASTER" ]; then
            echo "::error::This deployment is stale. Deploy the current master commit."
            exit 1
          fi
          PASSED=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&status=success&per_page=100" \
            --jq '.workflow_runs | any(.head_branch == "master" and (.event == "push" or .event == "workflow_dispatch"))')
          if [ "$PASSED" != true ]; then
            echo "::error::Current master must have a successful CI run before deployment."
            exit 1
          fi

      - name: Checkout verified release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Build immutable production image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f deploy/docker/Dockerfile \
            --tag "renttools-site:$DEPLOY_SHA" \
            --build-arg "GIT_COMMIT_SHA=$DEPLOY_SHA" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID \
            --build-arg "NEXT_PUBLIC_LEGACY_PASSPORT_OCR_ENABLED=${NEXT_PUBLIC_LEGACY_PASSPORT_OCR_ENABLED:-true}" \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN .
          docker image save "renttools-site:$DEPLOY_SHA" | gzip -1 > renttools-image.tar.gz
          sha256sum renttools-image.tar.gz > renttools-image.tar.gz.sha256

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-${{ env.DEPLOY_SHA }}
          path: |
            renttools-image.tar.gz
            renttools-image.tar.gz.sha256
          compression-level: 0
          retention-days: 3

  deploy:
    name: Replace RentTools Docker service
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DROPLET_HOST != '' }}
    timeout-minutes: 20
    environment: Production
    steps:
      - name: Refuse a stale deployment after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MASTER=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$DEPLOY_SHA" != "$CURRENT_MASTER" ]; then
            echo "::error::Master changed while waiting for approval. Deploy the new commit instead."
            exit 1
          fi

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-${{ env.DEPLOY_SHA }}

      - name: Upload image and invoke the installed deployment gateway
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.DROPLET_KNOWN_HOSTS }}
          DROPLET_HOST: ${{ vars.DROPLET_HOST }}
          DROPLET_USER: ${{ vars.DROPLET_USER }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$DROPLET_USER" ]; then
            echo "::error::Deployment credentials or host configuration are incomplete."
            exit 1
          fi
          sha256sum --check renttools-image.tar.gz.sha256
          SSH_DIR="$RUNNER_TEMP/renttools-deploy"
          mkdir -m 700 -p "$SSH_DIR"
          trap 'rm -f "$SSH_DIR/id_deploy"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$SSH_DIR/id_deploy"
          chmod 600 "$SSH_DIR/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          SSH=(ssh -i "$SSH_DIR/id_deploy" -o BatchMode=yes -o IdentitiesOnly=yes
               -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts"
               -o ConnectTimeout=15 -o ConnectionAttempts=1
               -o ServerAliveInterval=20 -o ServerAliveCountMax=20
               "$DROPLET_USER@$DROPLET_HOST")
          RECEIVED=$("${SSH[@]}" "renttools-upload $DEPLOY_SHA" < renttools-image.tar.gz)
          EXPECTED=$(sha256sum renttools-image.tar.gz | awk '{print $1}')
          if [ "$RECEIVED" != "$EXPECTED" ]; then
            echo "::error::Uploaded image checksum did not match."
            exit 1
          fi
          "${SSH[@]}" "renttools-deploy $DEPLOY_SHA"
