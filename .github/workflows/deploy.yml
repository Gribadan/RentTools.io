name: Deploy to droplet

# Two-stage pipeline:
#   1. build  — runs the heavy `npm ci + next build` on a 4-vCPU / 16 GB GH-hosted
#               runner. Produces a tarball with the built .next/ + the generated
#               Prisma client. Total ~3 min including dependency cache hits.
#   2. deploy — ships the tarball to the production droplet via scp, then triggers
#               scripts/install-build.sh which atomically swaps the artifact in
#               and restarts the systemd service. Total ~30s if package-lock
#               unchanged, ~4 min if a fresh `npm ci` is needed on the droplet.
#
# Replaces the previous on-droplet build path which took ~18 min on the small
# 458 MB box because V8 had to spill TypeScript-checking heap to swap.

on:
  # A master push first runs CI. Deployment becomes eligible only after that
  # exact commit passes; production never races against a failing test run.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Maintainer-only redeploy of current master, with successful CI required.
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy current master, or inspect the configured server without changing it"
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - preflight

permissions:
  contents: read
  actions: read

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Inspect configured server (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: Production
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight' &&
          github.repository == 'Gribadan/RentTools.io' && github.ref_protected &&
          vars.DROPLET_HOST != '' }}

    steps:
      - name: Checkout reviewed diagnostic script
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/deploy-preflight.py
          sparse-checkout-cone-mode: false

      - name: Inspect deployment configuration without changing the server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.DROPLET_KNOWN_HOSTS }}
          DROPLET_HOST: ${{ vars.DROPLET_HOST }}
          DROPLET_USER: ${{ vars.DROPLET_USER }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$DROPLET_USER" ]; then
            echo "::error::Existing deployment credentials or host configuration are incomplete."
            exit 1
          fi
          SSH_DIR="$RUNNER_TEMP/renttools-preflight"
          mkdir -m 700 -p "$SSH_DIR"
          trap 'rm -f "$SSH_DIR/id_deploy"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$SSH_DIR/id_deploy"
          chmod 600 "$SSH_DIR/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          if ! ssh -i "$SSH_DIR/id_deploy" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
              -o ConnectTimeout=15 -o ConnectionAttempts=1 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              "$DROPLET_USER@$DROPLET_HOST" 'python3 -' \
              < .github/scripts/deploy-preflight.py 2> "$SSH_DIR/ssh-error.log"; then
            if grep -qi 'timed out' "$SSH_DIR/ssh-error.log"; then
              echo "::error::Configured SSH host timed out from the GitHub runner."
            elif grep -qi 'Permission denied' "$SSH_DIR/ssh-error.log"; then
              echo "::error::Configured SSH credential was rejected."
            elif grep -qi 'Host key verification failed\|REMOTE HOST IDENTIFICATION HAS CHANGED' "$SSH_DIR/ssh-error.log"; then
              echo "::error::Configured SSH host key did not verify."
            elif grep -qi 'Connection closed\|Connection reset\|Connection refused' "$SSH_DIR/ssh-error.log"; then
              echo "::error::Configured SSH host closed or refused the connection."
            else
              echo "::error::Read-only deployment inspection failed; no deploy command was run."
            fi
            exit 1
          fi

  build:
    name: Build on runner
    runs-on: ubuntu-latest

    # Inert until the user wires DROPLET_HOST. Until then every push is a no-op.
    if: >-
      ${{ vars.DROPLET_HOST != '' &&
          ((github.event_name == 'workflow_dispatch' && inputs.mode != 'preflight' &&
            github.ref == 'refs/heads/master') ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'master' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    timeout-minutes: 20

    env:
      # The build doesn't query the DB but src/lib/prisma.ts initialises the
      # adapter at import time, which needs a URL it can parse. Use a throwaway
      # local SQLite path that never has to exist.
      DATABASE_URL: "file:./ci-build.db"
      JWT_SECRET: "ci-only-build-passes"
      CRON_SECRET: "ci-only-build-passes"

      # Sentry SDK init at build time — DSN gets baked into the client bundle,
      # auth token uploads source maps for readable stack traces. Both are
      # GitHub Actions secrets; if either is missing the build still passes,
      # just without source-map upload.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Google OAuth + One Tap — only the public client ID is baked into the
      # client bundle at build time; the secret stays server-side via
      # .env.production on the droplet.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      # Surfaced in /api/health and on Sentry events as the release identifier.
      # Job-level env cannot reference the env context during workflow validation.
      GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      NEXT_PUBLIC_GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Legacy passport-OCR upload. NEXT_PUBLIC_ vars are inlined into the
      # client bundle at build time, so this has to be set HERE — putting it in
      # .env.production on the droplet only reaches the server route and would
      # leave the upload UI hidden. Defaults to enabled; set the repo variable
      # to "false" to retire the legacy OCR path.
      NEXT_PUBLIC_LEGACY_PASSPORT_OCR_ENABLED: ${{ vars.NEXT_PUBLIC_LEGACY_PASSPORT_OCR_ENABLED }}

    steps:
      - name: Verify current master and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MASTER=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$DEPLOY_SHA" != "$CURRENT_MASTER" ]; then
            echo "::error::This deployment is stale. Run CI and deploy the current master commit."
            exit 1
          fi
          PASSED=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&status=success&per_page=100" \
            --jq '.workflow_runs | any(.head_branch == "master" and (.event == "push" or .event == "workflow_dispatch"))')
          if [ "$PASSED" != true ]; then
            echo "::error::Current master must have a successful CI run before deployment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (next build)
        run: npm run build

      - name: Bundle artifact
        run: |
          # Bundle .next/ + the generated Prisma client. Source files (src/,
          # prisma/, scripts/) are NOT shipped in the tarball — install-build.sh
          # does a `git reset --hard` on the droplet to keep them in sync with
          # the SHA that produced this build.
          tar -czf build.tar.gz .next src/generated/prisma
          echo "Artifact size: $(ls -lh build.tar.gz | awk '{print $5}')"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ env.DEPLOY_SHA }}
          path: build.tar.gz
          retention-days: 3

  deploy:
    name: Ship to droplet
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DROPLET_HOST != '' }}
    timeout-minutes: 10
    environment: Production

    steps:
      - name: Refuse a stale deployment after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MASTER=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$DEPLOY_SHA" != "$CURRENT_MASTER" ]; then
            echo "::error::Master changed while this deployment was waiting. Deploy the new commit instead."
            exit 1
          fi

      - name: Checkout (for scripts/install-build.sh)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # Just the install script; no need for a deep clone.
          sparse-checkout: |
            scripts/install-build.sh
          sparse-checkout-cone-mode: false

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: build-${{ env.DEPLOY_SHA }}

      - name: SSH key setup
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.DROPLET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::Missing DEPLOY_KEY secret. See docs/DROPLET-SETUP.md §10."
            exit 1
          fi
          if [ -z "${KNOWN_HOSTS:-}" ]; then
            echo "::error::Missing DROPLET_KNOWN_HOSTS variable. Run \`ssh-keyscan <ip>\` and paste output."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # GitHub Actions strips trailing newlines from secrets; OpenSSH refuses
          # to load a key without one. Force a trailing \n via printf '%s\n'.
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship build + install script to droplet
        env:
          DROPLET_HOST: ${{ vars.DROPLET_HOST }}
          DROPLET_USER: ${{ vars.DROPLET_USER }}
        run: |
          set -euo pipefail
          # Always run the install script we just checked out, not whatever
          # version happens to be on the droplet — keeps the script and the
          # artifact format in lockstep, even on the very first run when the
          # droplet doesn't yet have install-build.sh in its checkout.
          scp -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              build.tar.gz \
              scripts/install-build.sh \
              "${DROPLET_USER}@${DROPLET_HOST}:/tmp/"

      - name: Install build + restart service
        env:
          DROPLET_HOST: ${{ vars.DROPLET_HOST }}
          DROPLET_USER: ${{ vars.DROPLET_USER }}
        run: |
          set -euo pipefail
          # ServerAliveInterval keeps the connection open during the conditional
          # `npm ci` step (up to 4 min of silence if dependencies changed).
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "${DROPLET_USER}@${DROPLET_HOST}" \
              "bash -lc 'GIT_COMMIT_SHA=${{ env.DEPLOY_SHA }} bash /tmp/install-build.sh /tmp/build.tar.gz'"
